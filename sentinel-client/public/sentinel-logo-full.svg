<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none" role="img" aria-label="Sentinel">
  <defs>
    <linearGradient id="sg-full-grad" x1="68" y1="18" x2="68" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B9BF8"/>
      <stop offset="50%" stop-color="#3D6CE8"/>
      <stop offset="100%" stop-color="#1A2E7A"/>
    </linearGradient>
    <linearGradient id="sg-star-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8C8FF"/>
      <stop offset="100%" stop-color="#6BA3FF"/>
    </linearGradient>
  </defs>

  <!-- Upper ribbon of the S -->
  <path d="M 98 32 C 112 32, 122 22, 112 14 C 102 6, 72 8, 56 16 C 34 26, 22 46, 30 64 C 36 78, 52 86, 68 90 C 80 94, 88 100, 86 110 C 84 120, 72 128, 58 126 C 46 124, 38 116, 40 106"
    stroke="url(#sg-full-grad)" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Lower ribbon of the S -->
  <path d="M 54 126 C 40 126, 30 136, 40 144 C 50 152, 80 150, 96 142 C 118 132, 130 112, 122 94 C 116 80, 100 72, 84 68 C 72 64, 64 58, 66 48 C 68 38, 80 30, 94 32 C 106 34, 114 42, 112 52"
    stroke="url(#sg-full-grad)" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- 4-point star -->
  <g transform="translate(76,80)">
    <path d="M0,-13 L2.8,-2.8 L0,0 L-2.8,-2.8Z" fill="url(#sg-star-grad)"/>
    <path d="M0,13 L-2.8,2.8 L0,0 L2.8,2.8Z" fill="url(#sg-star-grad)"/>
    <path d="M-13,0 L-2.8,-2.8 L0,0 L-2.8,2.8Z" fill="url(#sg-star-grad)"/>
    <path d="M13,0 L2.8,2.8 L0,0 L2.8,-2.8Z" fill="url(#sg-star-grad)"/>
  </g>

  <!-- Wordmark -->
  <text x="155" y="104"
    font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="68" font-weight="600" letter-spacing="-1" fill="#0D1540">Sentinel</text>

  <!-- Blue accent dot over the i -->
  <circle cx="297" cy="44" r="5" fill="#3D6CE8"/>
</svg>
